<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" role="img" aria-labelledby="stackTitle stackDesc">
  <title id="stackTitle">Prayoga Putra's Cyberpunk Tech Stack Matrix</title>
  <desc id="stackDesc">Cyberpunk HUD module showcasing Core Backend, UI Matrix, Data Vault, and Ops Deploy toolsets.</desc>
  <defs>
    <linearGradient id="stackDarkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05030c"/>
      <stop offset="50%" stop-color="#0d071e"/>
      <stop offset="100%" stop-color="#140929"/>
    </linearGradient>

    <linearGradient id="neonBarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>

    <pattern id="stackScan" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.25" stroke-width="1.5"/>
    </pattern>

    <pattern id="pixelGridSmall" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#7928ca" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="360" rx="18" fill="url(#stackDarkBg)" stroke="#3a1e68" stroke-width="2"/>
  <rect width="1200" height="360" rx="18" fill="url(#pixelGridSmall)"/>

  <!-- Corner Brackets -->
  <path d="M 16 40 L 16 16 L 40 16" fill="none" stroke="#00f0ff" stroke-width="2.5" shape-rendering="crispEdges"/>
  <path d="M 1160 16 L 1184 16 L 1184 40" fill="none" stroke="#ff007f" stroke-width="2.5" shape-rendering="crispEdges"/>
  <path d="M 16 320 L 16 344 L 40 344" fill="none" stroke="#00f0ff" stroke-width="2.5" shape-rendering="crispEdges"/>
  <path d="M 1160 344 L 1184 344 L 1184 320" fill="none" stroke="#ffe600" stroke-width="2.5" shape-rendering="crispEdges"/>

  <!-- Top Title Header -->
  <g font-family="'Courier New', monospace, sans-serif">
    <text x="40" y="44" fill="#ff007f" font-size="12" font-weight="900" letter-spacing="3">MODULE://TECH_STACK_MATRIX</text>
    <text x="40" y="74" fill="#f8fafc" font-size="22" font-weight="800">ENGINEERING ARSENAL &amp; CAPABILITIES</text>
    <text x="1150" y="52" fill="#00f0ff" font-size="11" font-weight="700" text-anchor="end" letter-spacing="2">[ V.2077 // LOADED ]</text>
  </g>

  <!-- Neon Separator with Pixel Endcaps -->
  <rect x="40" y="90" width="1120" height="2" fill="url(#neonBarGrad)"/>
  <rect x="38" y="88" width="6" height="6" fill="#00f0ff" shape-rendering="crispEdges"/>
  <rect x="1156" y="88" width="6" height="6" fill="#ffe600" shape-rendering="crispEdges"/>

  <!-- 4 Module HUD Columns -->
  <g font-family="'Courier New', monospace, sans-serif">
    
    <!-- MODULE 01: CORE BACKEND -->
    <g transform="translate(40, 115)">
      <rect width="265" height="210" rx="10" fill="#090517" stroke="#00f0ff" stroke-width="1.2"/>
      <rect x="0" y="0" width="265" height="28" rx="10" fill="#0f172a" stroke="#00f0ff" stroke-width="1"/>
      <rect x="0" y="16" width="265" height="12" fill="#0f172a"/>
      <circle cx="16" cy="14" r="4" fill="#00f0ff"/>
      <text x="28" y="18" fill="#00f0ff" font-size="11" font-weight="900" letter-spacing="1">01 // CORE_BACKEND</text>

      <!-- Badge Chips -->
      <g transform="translate(14, 42)" font-size="11" font-weight="800">
        <!-- Row 1 -->
        <rect x="0" y="0" width="110" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="55" y="20" fill="#00f0ff" text-anchor="middle">PHP</text>
        <rect x="120" y="0" width="117" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="178" y="20" fill="#f8fafc" text-anchor="middle">Laravel</text>

        <!-- Row 2 -->
        <rect x="0" y="42" width="110" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="55" y="62" fill="#f8fafc" text-anchor="middle">Node.js</text>
        <rect x="120" y="42" width="117" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="178" y="62" fill="#f8fafc" text-anchor="middle">Express.js</text>

        <!-- Row 3 -->
        <rect x="0" y="84" width="110" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="55" y="104" fill="#f8fafc" text-anchor="middle">REST APIs</text>
        <rect x="120" y="84" width="117" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="178" y="104" fill="#00f0ff" text-anchor="middle">Inertia.js</text>

        <!-- Footer Tag -->
        <text x="118" y="148" fill="#64748b" font-size="9" text-anchor="middle" letter-spacing="1">&gt; ARCHITECTURE &amp; PERFORMANCE</text>
      </g>
    </g>

    <!-- MODULE 02: UI MATRIX -->
    <g transform="translate(325, 115)">
      <rect width="265" height="210" rx="10" fill="#090517" stroke="#ff007f" stroke-width="1.2"/>
      <rect x="0" y="0" width="265" height="28" rx="10" fill="#1f0a1c" stroke="#ff007f" stroke-width="1"/>
      <rect x="0" y="16" width="265" height="12" fill="#1f0a1c"/>
      <circle cx="16" cy="14" r="4" fill="#ff007f"/>
      <text x="28" y="18" fill="#ff007f" font-size="11" font-weight="900" letter-spacing="1">02 // UI_MATRIX</text>

      <g transform="translate(14, 42)" font-size="11" font-weight="800">
        <rect x="0" y="0" width="110" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="55" y="20" fill="#ff007f" text-anchor="middle">Vue.js</text>
        <rect x="120" y="0" width="117" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="178" y="20" fill="#f8fafc" text-anchor="middle">React.js</text>

        <rect x="0" y="42" width="110" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="55" y="62" fill="#f8fafc" text-anchor="middle">Next.js</text>
        <rect x="120" y="42" width="117" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="178" y="62" fill="#ff007f" text-anchor="middle">TypeScript</text>

        <rect x="0" y="84" width="110" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="55" y="104" fill="#f8fafc" text-anchor="middle">Tailwind</text>
        <rect x="120" y="84" width="117" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="178" y="104" fill="#f8fafc" text-anchor="middle">Shadcn/UI</text>

        <text x="118" y="148" fill="#64748b" font-size="9" text-anchor="middle" letter-spacing="1">&gt; REACTIVE &amp; MODERN INTERFACES</text>
      </g>
    </g>

    <!-- MODULE 03: DATA VAULT -->
    <g transform="translate(610, 115)">
      <rect width="265" height="210" rx="10" fill="#090517" stroke="#34d399" stroke-width="1.2"/>
      <rect x="0" y="0" width="265" height="28" rx="10" fill="#081a14" stroke="#34d399" stroke-width="1"/>
      <rect x="0" y="16" width="265" height="12" fill="#081a14"/>
      <circle cx="16" cy="14" r="4" fill="#34d399"/>
      <text x="28" y="18" fill="#34d399" font-size="11" font-weight="900" letter-spacing="1">03 // DATA_VAULT</text>

      <g transform="translate(14, 42)" font-size="11" font-weight="800">
        <rect x="0" y="0" width="110" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="55" y="20" fill="#34d399" text-anchor="middle">PostgreSQL</text>
        <rect x="120" y="0" width="117" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="178" y="20" fill="#f8fafc" text-anchor="middle">MySQL</text>

        <rect x="0" y="42" width="110" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="55" y="62" fill="#f8fafc" text-anchor="middle">Redis</text>
        <rect x="120" y="42" width="117" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="178" y="62" fill="#34d399" text-anchor="middle">SQL Tuning</text>

        <rect x="0" y="84" width="110" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="55" y="104" fill="#f8fafc" text-anchor="middle">Schemas</text>
        <rect x="120" y="84" width="117" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="178" y="104" fill="#f8fafc" text-anchor="middle">ACID Safety</text>

        <text x="118" y="148" fill="#64748b" font-size="9" text-anchor="middle" letter-spacing="1">&gt; TRANSACTION INTEGRITY &amp; SPEED</text>
      </g>
    </g>

    <!-- MODULE 04: OPS DEPLOY -->
    <g transform="translate(895, 115)">
      <rect width="265" height="210" rx="10" fill="#090517" stroke="#ffe600" stroke-width="1.2"/>
      <rect x="0" y="0" width="265" height="28" rx="10" fill="#1c1808" stroke="#ffe600" stroke-width="1"/>
      <rect x="0" y="16" width="265" height="12" fill="#1c1808"/>
      <circle cx="16" cy="14" r="4" fill="#ffe600"/>
      <text x="28" y="18" fill="#ffe600" font-size="11" font-weight="900" letter-spacing="1">04 // OPS_DEPLOY</text>

      <g transform="translate(14, 42)" font-size="11" font-weight="800">
        <rect x="0" y="0" width="110" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="55" y="20" fill="#ffe600" text-anchor="middle">Docker</text>
        <rect x="120" y="0" width="117" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="178" y="20" fill="#f8fafc" text-anchor="middle">Linux OS</text>

        <rect x="0" y="42" width="110" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="55" y="62" fill="#f8fafc" text-anchor="middle">Git / Hub</text>
        <rect x="120" y="42" width="117" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="178" y="62" fill="#ffe600" text-anchor="middle">Postman</text>

        <rect x="0" y="84" width="110" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="55" y="104" fill="#f8fafc" text-anchor="middle">Vite</text>
        <rect x="120" y="84" width="117" height="32" rx="4" fill="#111827" stroke="#374151"/><text x="178" y="104" fill="#f8fafc" text-anchor="middle">Nginx</text>

        <text x="118" y="148" fill="#64748b" font-size="9" text-anchor="middle" letter-spacing="1">&gt; REPRODUCIBLE CONTAINER WORKFLOWS</text>
      </g>
    </g>
  </g>

  <!-- Scanline Overlay -->
  <rect width="1200" height="360" rx="18" fill="url(#stackScan)" pointer-events="none"/>
</svg>
