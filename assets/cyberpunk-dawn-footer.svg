<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%" role="img">
  <defs>
    <linearGradient id="dawnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05030d"/>
      <stop offset="50%" stop-color="#1e0730"/>
      <stop offset="85%" stop-color="#4d0f47"/>
      <stop offset="100%" stop-color="#0a0514"/>
    </linearGradient>
    <pattern id="gridPersp" width="30" height="15" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 15" fill="none" stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <pattern id="dawnScan" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.22" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="200" rx="12" fill="url(#dawnSky)"/>

  <!-- Minimal Silhouette Skyline -->
  <g fill="#0c0617" shape-rendering="crispEdges">
    <rect x="0" y="60" width="50" height="140"/><rect x="40" y="40" width="45" height="160"/>
    <rect x="75" y="70" width="60" height="130"/><rect x="125" y="30" width="55" height="170"/>
    <rect x="170" y="65" width="70" height="135"/><rect x="230" y="45" width="50" height="155"/>
    <rect x="270" y="80" width="60" height="120"/><rect x="320" y="35" width="65" height="165"/>
    <rect x="375" y="60" width="70" height="140"/><rect x="435" y="45" width="55" height="155"/>
    <!-- Center Space for text -->
    <rect x="710" y="55" width="55" height="145"/><rect x="755" y="35" width="65" height="165"/>
    <rect x="810" y="70" width="60" height="130"/><rect x="860" y="40" width="55" height="160"/>
    <rect x="905" y="65" width="70" height="135"/><rect x="965" y="30" width="55" height="170"/>
    <rect x="1010" y="75" width="60" height="125"/><rect x="1060" y="45" width="65" height="155"/>
    <rect x="1115" y="60" width="90" height="140"/>
  </g>

  <!-- Glowing Grid Floor -->
  <rect x="0" y="130" width="1200" height="70" fill="url(#gridPersp)"/>
  <rect x="0" y="128" width="1200" height="2" fill="#ff007f" opacity="0.8"/>

  <!-- Center Signature Text -->
  <g font-family="'Courier New', monospace" text-anchor="middle">
    <text x="600" y="75" fill="#00f0ff" font-size="14" font-weight="900" letter-spacing="3">[ END OF TRANSMISSION // SURAKARTA_NODE ]</text>
    <text x="600" y="105" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="1">PRAYOGA PUTRA &#183; FULL-STACK DEVELOPER</text>
    <text x="600" y="140" fill="#94a3b8" font-size="12" letter-spacing="2">"Build clean, ship robust, scale safely."</text>
    <text x="600" y="172" fill="#ffe600" font-size="11" font-weight="700" letter-spacing="2">⚡ 2077 ALL SYSTEMS OPERATIONAL ⚡</text>
  </g>

  <rect width="1200" height="200" rx="12" fill="url(#dawnScan)" pointer-events="none"/>
</svg>