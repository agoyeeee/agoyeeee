<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" role="img" aria-labelledby="projTitle projDesc">
  <title id="projTitle">Prayoga Putra's Cyberpunk Featured Projects Databank</title>
  <desc id="projDesc">Four selected software systems: Portfolio 2.0, Enterprise ERP, Pharmacy Management, and Final Project System.</desc>
  <defs>
    <linearGradient id="projDarkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05030c"/>
      <stop offset="50%" stop-color="#0d071e"/>
      <stop offset="100%" stop-color="#140929"/>
    </linearGradient>

    <linearGradient id="projLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <pattern id="projScan" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.25" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#projDarkBg)" stroke="#3a1e68" stroke-width="2"/>

  <!-- Top Title Bar -->
  <g font-family="'Courier New', monospace, sans-serif">
    <text x="40" y="44" fill="#ff007f" font-size="12" font-weight="900" letter-spacing="3">DATABANK://DEPLOYED_SYSTEMS</text>
    <text x="40" y="74" fill="#f8fafc" font-size="22" font-weight="800">FEATURED PROJECTS &amp; CODEBASES</text>
    <text x="1150" y="52" fill="#34d399" font-size="11" font-weight="700" text-anchor="end" letter-spacing="2">[ ACCESS: GRANTED ]</text>
  </g>

  <!-- Separator Line -->
  <rect x="40" y="90" width="1120" height="2" fill="url(#projLineGrad)"/>
  <rect x="38" y="88" width="6" height="6" fill="#ff007f" shape-rendering="crispEdges"/>
  <rect x="1156" y="88" width="6" height="6" fill="#34d399" shape-rendering="crispEdges"/>

  <!-- 2x2 Grid Project Cards -->
  <g font-family="'Courier New', monospace, sans-serif">
    
    <!-- PROJECT 1: DIGITAL PORTFOLIO 2.0 (Top Left) -->
    <g transform="translate(40, 115)">
      <rect width="548" height="120" rx="10" fill="#090517" stroke="#00f0ff" stroke-width="1.2"/>
      <rect x="16" y="16" width="30" height="20" rx="3" fill="#0c192c" stroke="#00f0ff" stroke-width="1"/>
      <text x="31" y="30" fill="#00f0ff" font-size="10" font-weight="900" text-anchor="middle">01</text>
      
      <text x="56" y="32" fill="#f8fafc" font-size="17" font-weight="800">Digital Portfolio 2.0</text>
      <text x="528" y="32" fill="#00ff66" font-size="11" font-weight="800" text-anchor="end">[LIVE SITE]</text>
      
      <text x="16" y="62" fill="#cbd5e1" font-size="12">Interactive developer portfolio, responsive UI, &amp; visual showcase.</text>
      
      <rect x="16" y="82" width="516" height="22" rx="4" fill="#06121e"/>
      <text x="26" y="97" fill="#00f0ff" font-size="10" font-weight="800" letter-spacing="1">NEXT.JS • TYPESCRIPT • TAILWIND CSS • VERCEL</text>
    </g>

    <!-- PROJECT 2: ENTERPRISE ERP SYSTEM (Top Right) -->
    <g transform="translate(612, 115)">
      <rect width="548" height="120" rx="10" fill="#090517" stroke="#ff007f" stroke-width="1.2"/>
      <rect x="16" y="16" width="30" height="20" rx="3" fill="#260b20" stroke="#ff007f" stroke-width="1"/>
      <text x="31" y="30" fill="#ff007f" font-size="10" font-weight="900" text-anchor="middle">02</text>

      <text x="56" y="32" fill="#f8fafc" font-size="17" font-weight="800">Enterprise ERP System</text>
      <text x="528" y="32" fill="#ffe600" font-size="11" font-weight="800" text-anchor="end">[INTERNAL]</text>

      <text x="16" y="62" fill="#cbd5e1" font-size="12">Purchasing, raw material requests, inventory ledger &amp; audit trails.</text>

      <rect x="16" y="82" width="516" height="22" rx="4" fill="#1f091c"/>
      <text x="26" y="97" fill="#ff007f" font-size="10" font-weight="800" letter-spacing="1">LARAVEL • POSTGRESQL • VUE.JS • DOCKER</text>
    </g>

    <!-- PROJECT 3: PHARMACY MANAGEMENT (Bottom Left) -->
    <g transform="translate(40, 252)">
      <rect width="548" height="120" rx="10" fill="#090517" stroke="#34d399" stroke-width="1.2"/>
      <rect x="16" y="16" width="30" height="20" rx="3" fill="#0b221d" stroke="#34d399" stroke-width="1"/>
      <text x="31" y="30" fill="#34d399" font-size="10" font-weight="900" text-anchor="middle">03</text>

      <text x="56" y="32" fill="#f8fafc" font-size="17" font-weight="800">Sistem Manajemen Obat</text>
      <text x="528" y="32" fill="#34d399" font-size="11" font-weight="800" text-anchor="end">[GITHUB REPO]</text>

      <text x="16" y="62" fill="#cbd5e1" font-size="12">Medicine inventory, batch expiry alerts &amp; transaction logger.</text>

      <rect x="16" y="82" width="516" height="22" rx="4" fill="#071d15"/>
      <text x="26" y="97" fill="#34d399" font-size="10" font-weight="800" letter-spacing="1">PHP • LARAVEL • MYSQL • BOOTSTRAP</text>
    </g>

    <!-- PROJECT 4: SISTEM FINAL PROJECT (Bottom Right) -->
    <g transform="translate(612, 252)">
      <rect width="548" height="120" rx="10" fill="#090517" stroke="#ffe600" stroke-width="1.2"/>
      <rect x="16" y="16" width="30" height="20" rx="3" fill="#241d08" stroke="#ffe600" stroke-width="1"/>
      <text x="31" y="30" fill="#ffe600" font-size="10" font-weight="900" text-anchor="middle">04</text>

      <text x="56" y="32" fill="#f8fafc" font-size="17" font-weight="800">Sistem Final Project</text>
      <text x="528" y="32" fill="#ffe600" font-size="11" font-weight="800" text-anchor="end">[GITHUB REPO]</text>

      <text x="16" y="62" fill="#cbd5e1" font-size="12">Academic milestone management &amp; advisor submission dashboard.</text>

      <rect x="16" y="82" width="516" height="22" rx="4" fill="#1c1606"/>
      <text x="26" y="97" fill="#ffe600" font-size="10" font-weight="800" letter-spacing="1">VUE.JS • VITE • TAILWIND CSS • REST API</text>
    </g>

  </g>

  <!-- Scanline Overlay -->
  <rect width="1200" height="400" rx="18" fill="url(#projScan)" pointer-events="none"/>
</svg>
