<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24" role="img">
  <defs>
    <linearGradient id="dividerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="75%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ffe600" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .pixel-pulse { animation: pulseDivider 2.5s infinite ease-in-out; }
    @keyframes pulseDivider {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
  <g class="pixel-pulse" shape-rendering="crispEdges">
    <rect x="100" y="11" width="1000" height="2" fill="url(#dividerGrad)"/>
    <rect x="580" y="7" width="10" height="10" fill="#00f0ff"/>
    <rect x="595" y="5" width="14" height="14" fill="#ff007f"/>
    <rect x="614" y="7" width="10" height="10" fill="#ffe600"/>
    <rect x="250" y="9" width="6" height="6" fill="#00f0ff"/>
    <rect x="944" y="9" width="6" height="6" fill="#ffe600"/>
  </g>
</svg>
