<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Prayoga Putra — Cyberpunk Full-Stack Operator</title>
  <desc id="heroDesc">Cyberpunk HUD interface banner for Prayoga Putra featuring system specs, core stack, and live terminal telemetry.</desc>
  <defs>
    <linearGradient id="heroDarkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05030c"/>
      <stop offset="45%" stop-color="#0e0720"/>
      <stop offset="85%" stop-color="#190930"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <linearGradient id="neonCyanPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="heroScan" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.3" stroke-width="1.5"/>
    </pattern>

    <!-- Cyberpunk Pixel Grid Pattern -->
    <pattern id="cyberGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#7928ca" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .blink-dot { animation: blink 1.2s infinite steps(1); }
    .glitch-anim { animation: glitchText 6s infinite; }
    .pulse-glow { animation: pulse 3s infinite ease-in-out; }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.1; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.35; }
    }
  </style>

  <!-- Base Container -->
  <rect width="1200" height="440" rx="20" fill="url(#heroDarkBg)" stroke="#3a1e68" stroke-width="2"/>
  <rect width="1200" height="440" rx="20" fill="url(#cyberGrid)"/>

  <!-- Cyber Neon Accents -->
  <circle cx="1100" cy="80" r="140" fill="#ff007f" fill-opacity="0.08" filter="url(#cyanGlow)"/>
  <circle cx="100" cy="380" r="120" fill="#00f0ff" fill-opacity="0.07" filter="url(#cyanGlow)"/>

  <!-- HUD Corner Brackets (Pixel Cyberpunk) -->
  <!-- Top Left -->
  <path d="M 24 54 L 24 24 L 54 24" fill="none" stroke="#00f0ff" stroke-width="3" shape-rendering="crispEdges"/>
  <rect x="20" y="20" width="8" height="8" fill="#ff007f" shape-rendering="crispEdges"/>
  <!-- Top Right -->
  <path d="M 1146 24 L 1176 24 L 1176 54" fill="none" stroke="#00f0ff" stroke-width="3" shape-rendering="crispEdges"/>
  <rect x="1172" y="20" width="8" height="8" fill="#ff007f" shape-rendering="crispEdges"/>
  <!-- Bottom Left -->
  <path d="M 24 386 L 24 416 L 54 416" fill="none" stroke="#00f0ff" stroke-width="3" shape-rendering="crispEdges"/>
  <rect x="20" y="412" width="8" height="8" fill="#ff007f" shape-rendering="crispEdges"/>
  <!-- Bottom Right -->
  <path d="M 1146 416 L 1176 416 L 1176 386" fill="none" stroke="#00f0ff" stroke-width="3" shape-rendering="crispEdges"/>
  <rect x="1172" y="412" width="8" height="8" fill="#ff007f" shape-rendering="crispEdges"/>

  <!-- Top System Header Bar -->
  <g font-family="'Courier New', monospace, 'Segoe UI', sans-serif" transform="translate(68, 52)">
    <rect x="0" y="-14" width="220" height="24" rx="4" fill="#080314" stroke="#ff007f" stroke-width="1"/>
    <circle cx="14" cy="-2" r="4" fill="#00ff66" class="blink-dot"/>
    <text x="28" y="2" fill="#00f0ff" font-size="12" font-weight="900" letter-spacing="1.5">SYS://OPERATOR_ONLINE</text>

    <!-- Center Coordinates / Node -->
    <text x="260" y="2" fill="#64748b" font-size="11" font-weight="700" letter-spacing="2">NODE: SURAKARTA_INDONESIA [UNS]</text>
  </g>

  <!-- Left Main Content -->
  <g font-family="'Courier New', monospace, 'Segoe UI', sans-serif">
    <!-- Subtitle / Callout -->
    <text x="70" y="112" fill="#ff007f" font-size="13" font-weight="900" letter-spacing="4">FULL-STACK DEVELOPER &amp; SYSTEM ARCHITECT</text>
    
    <!-- Main Name Title -->
    <g font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
      <text x="66" y="178" fill="url(#titleGrad)" font-size="58" font-weight="900" letter-spacing="-1.5">PRAYOGA PUTRA</text>
    </g>

    <!-- Katakana Cyber Accents -->
    <text x="590" y="145" fill="#00f0ff" font-size="13" font-weight="900" letter-spacing="3" opacity="0.85">プラヨガ・プトラ // 2077</text>

    <!-- Neon Divider Line with pixel notches -->
    <rect x="70" y="196" width="460" height="3" fill="url(#neonCyanPink)"/>
    <rect x="70" y="193" width="8" height="9" fill="#00f0ff" shape-rendering="crispEdges"/>
    <rect x="522" y="193" width="8" height="9" fill="#ffe600" shape-rendering="crispEdges"/>

    <!-- Profile Description -->
    <text x="70" y="238" fill="#f1f5f9" font-size="19" font-weight="700">Informatics Engineering @ Universitas Sebelas Maret</text>
    
    <g fill="#94a3b8" font-size="14">
      <text x="70" y="272">Specialized in enterprise ERPs, purchasing, &amp; inventory systems.</text>
      <text x="70" y="296">Crafting robust backends, reactive frontends, &amp; clean architectures.</text>
    </g>

    <!-- Cyber Status Pill Badges -->
    <g transform="translate(70, 332)" font-size="11" font-weight="800" letter-spacing="1">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="105" height="28" rx="4" fill="#0c192c" stroke="#00f0ff" stroke-width="1.2"/>
      <text x="52" y="18" fill="#00f0ff" text-anchor="middle">LARAVEL</text>

      <!-- Badge 2 -->
      <rect x="115" y="0" width="115" height="28" rx="4" fill="#260b20" stroke="#ff007f" stroke-width="1.2"/>
      <text x="172" y="18" fill="#ff007f" text-anchor="middle">VUE / REACT</text>

      <!-- Badge 3 -->
      <rect x="240" y="0" width="100" height="28" rx="4" fill="#0b221d" stroke="#34d399" stroke-width="1.2"/>
      <text x="290" y="18" fill="#34d399" text-anchor="middle">NEXT.JS</text>

      <!-- Badge 4 -->
      <rect x="350" y="0" width="120" height="28" rx="4" fill="#241d08" stroke="#ffe600" stroke-width="1.2"/>
      <text x="410" y="18" fill="#ffe600" text-anchor="middle">POSTGRESQL</text>

      <!-- Badge 5 -->
      <rect x="480" y="0" width="95" height="28" rx="4" fill="#140f2b" stroke="#a78bfa" stroke-width="1.2"/>
      <text x="527" y="18" fill="#a78bfa" text-anchor="middle">DOCKER</text>
    </g>
  </g>

  <!-- Right Terminal HUD Box -->
  <g transform="translate(760, 68)" font-family="'Courier New', monospace, 'Lucida Console', sans-serif">
    <!-- Box Background & Border -->
    <rect width="370" height="305" rx="12" fill="#080414" fill-opacity="0.95" stroke="#3a1e68" stroke-width="2"/>
    <rect width="370" height="34" rx="12" fill="#120826" stroke="#3a1e68" stroke-width="1"/>
    <!-- Bottom square corners fix for header -->
    <rect x="0" y="20" width="370" height="14" fill="#120826"/>

    <!-- Terminal Window Dots -->
    <circle cx="22" cy="17" r="5" fill="#ff0055"/>
    <circle cx="40" cy="17" r="5" fill="#ffe600"/>
    <circle cx="58" cy="17" r="5" fill="#00ff66"/>

    <text x="80" y="21" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">TERMINAL // AG-2077.sh</text>

    <!-- Terminal Commands & Logs -->
    <g transform="translate(20, 64)" font-size="12" font-weight="700">
      <text x="0" y="0" fill="#00f0ff">$ agoyeeee --profile --verbose</text>
      
      <text x="0" y="26" fill="#64748b">&gt; OPERATOR  : </text>
      <text x="110" y="26" fill="#f8fafc">Prayoga Putra</text>

      <text x="0" y="50" fill="#64748b">&gt; CLASS     : </text>
      <text x="110" y="50" fill="#00f0ff">Full-Stack Dev</text>

      <text x="0" y="74" fill="#64748b">&gt; CAMPUS    : </text>
      <text x="110" y="74" fill="#ff007f">UNS Surakarta</text>

      <text x="0" y="98" fill="#64748b">&gt; SPECIALTY : </text>
      <text x="110" y="98" fill="#ffe600">Enterprise ERPs</text>

      <text x="0" y="122" fill="#64748b">&gt; RUNTIME   : </text>
      <text x="110" y="122" fill="#34d399">Docker • Linux</text>

      <!-- Inner Divider -->
      <line x1="0" y1="140" x2="330" y2="140" stroke="#251647" stroke-width="1.5" stroke-dasharray="6,4"/>

      <text x="0" y="166" fill="#a78bfa">&gt; SYSTEM PHILOSOPHY:</text>
      <text x="0" y="188" fill="#cbd5e1" font-size="11" font-weight="500">"Build clean, ship robust, scale safely."</text>

      <!-- Status Footer Indicator -->
      <g transform="translate(0, 214)">
        <rect x="0" y="-12" width="330" height="26" rx="4" fill="#041a10" stroke="#00ff66" stroke-width="1"/>
        <circle cx="16" cy="1" r="4" fill="#00ff66" class="blink-dot"/>
        <text x="30" y="5" fill="#00ff66" font-size="11" letter-spacing="1">STATUS: OPERATIONAL [READY]</text>
      </g>
    </g>
  </g>

  <!-- Scanline CRT Overlay -->
  <rect width="1200" height="440" rx="20" fill="url(#heroScan)" pointer-events="none"/>
</svg>
