<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="100%" role="img" aria-labelledby="buildTitle buildDesc">
  <title id="buildTitle">Currently Building — Active Cyberpunk System Focus</title>
  <desc id="buildDesc">Active engineering priorities: purchasing systems, inventory matrix, transaction engine, and container infrastructure.</desc>
  <defs>
    <linearGradient id="buildDarkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05030c"/>
      <stop offset="50%" stop-color="#0d071e"/>
      <stop offset="100%" stop-color="#140929"/>
    </linearGradient>

    <linearGradient id="buildLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <pattern id="buildScan" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.25" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="290" rx="18" fill="url(#buildDarkBg)" stroke="#3a1e68" stroke-width="2"/>

  <!-- Top Title -->
  <g font-family="'Courier New', monospace, sans-serif">
    <text x="40" y="44" fill="#00f0ff" font-size="12" font-weight="900" letter-spacing="3">EXEC_LOG://ACTIVE_DIRECTIVES</text>
    <text x="40" y="74" fill="#f8fafc" font-size="22" font-weight="800">SYSTEMS CURRENTLY IN PRODUCTION &amp; DEVELOPMENT</text>
  </g>

  <!-- Separator Line -->
  <rect x="40" y="90" width="1120" height="2" fill="url(#buildLineGrad)"/>
  <rect x="38" y="88" width="6" height="6" fill="#00f0ff" shape-rendering="crispEdges"/>
  <rect x="1156" y="88" width="6" height="6" fill="#00f0ff" shape-rendering="crispEdges"/>

  <!-- 4 Directive Cards -->
  <g font-family="'Courier New', monospace, sans-serif">
    <!-- Card 1: Purchasing ERP -->
    <g transform="translate(40, 114)">
      <rect width="265" height="142" rx="10" fill="#090517" stroke="#00f0ff" stroke-width="1.2"/>
      <rect x="16" y="16" width="34" height="22" rx="4" fill="#0c192c" stroke="#00f0ff" stroke-width="1"/>
      <text x="33" y="32" fill="#00f0ff" font-size="11" font-weight="900" text-anchor="middle">01</text>
      
      <text x="16" y="64" fill="#f8fafc" font-size="16" font-weight="800">Purchasing ERP</text>
      <text x="16" y="88" fill="#94a3b8" font-size="11">Automated PO workflows,</text>
      <text x="16" y="104" fill="#94a3b8" font-size="11">vendor price comparisons &amp;</text>
      <text x="16" y="120" fill="#94a3b8" font-size="11">approval authorization.</text>
      
      <!-- Status Tag -->
      <text x="245" y="32" fill="#00ff66" font-size="10" font-weight="800" text-anchor="end">[ACTIVE]</text>
    </g>

    <!-- Card 2: Inventory Matrix -->
    <g transform="translate(325, 114)">
      <rect width="265" height="142" rx="10" fill="#090517" stroke="#ff007f" stroke-width="1.2"/>
      <rect x="16" y="16" width="34" height="22" rx="4" fill="#260b20" stroke="#ff007f" stroke-width="1"/>
      <text x="33" y="32" fill="#ff007f" font-size="11" font-weight="900" text-anchor="middle">02</text>

      <text x="16" y="64" fill="#f8fafc" font-size="16" font-weight="800">Inventory Matrix</text>
      <text x="16" y="88" fill="#94a3b8" font-size="11">Raw materials tracking,</text>
      <text x="16" y="104" fill="#94a3b8" font-size="11">warehouse batch audits &amp;</text>
      <text x="16" y="120" fill="#94a3b8" font-size="11">multi-location stock sync.</text>

      <text x="245" y="32" fill="#ff007f" font-size="10" font-weight="800" text-anchor="end">[BUILDING]</text>
    </g>

    <!-- Card 3: Transaction Safety -->
    <g transform="translate(610, 114)">
      <rect width="265" height="142" rx="10" fill="#090517" stroke="#34d399" stroke-width="1.2"/>
      <rect x="16" y="16" width="34" height="22" rx="4" fill="#0b221d" stroke="#34d399" stroke-width="1"/>
      <text x="33" y="32" fill="#34d399" font-size="11" font-weight="900" text-anchor="middle">03</text>

      <text x="16" y="64" fill="#f8fafc" font-size="16" font-weight="800">Backend Core</text>
      <text x="16" y="88" fill="#94a3b8" font-size="11">ACID transactional locks,</text>
      <text x="16" y="104" fill="#94a3b8" font-size="11">optimized query indexes &amp;</text>
      <text x="16" y="120" fill="#94a3b8" font-size="11">auditable ledger logging.</text>

      <text x="245" y="32" fill="#34d399" font-size="10" font-weight="800" text-anchor="end">[OPTIMIZING]</text>
    </g>

    <!-- Card 4: Docker & DevOps -->
    <g transform="translate(895, 114)">
      <rect width="265" height="142" rx="10" fill="#090517" stroke="#ffe600" stroke-width="1.2"/>
      <rect x="16" y="16" width="34" height="22" rx="4" fill="#241d08" stroke="#ffe600" stroke-width="1"/>
      <text x="33" y="32" fill="#ffe600" font-size="11" font-weight="900" text-anchor="middle">04</text>

      <text x="16" y="64" fill="#f8fafc" font-size="16" font-weight="800">DevOps Infra</text>
      <text x="16" y="88" fill="#94a3b8" font-size="11">Docker containerization,</text>
      <text x="16" y="104" fill="#94a3b8" font-size="11">Linux server provisioning &amp;</text>
      <text x="16" y="120" fill="#94a3b8" font-size="11">automated build pipelines.</text>

      <text x="245" y="32" fill="#ffe600" font-size="10" font-weight="800" text-anchor="end">[DEPLOYED]</text>
    </g>
  </g>

  <!-- Scanline Overlay -->
  <rect width="1200" height="290" rx="18" fill="url(#buildScan)" pointer-events="none"/>
</svg>
